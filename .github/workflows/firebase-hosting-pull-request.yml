name: Desplegar a preview en Pull Request Naranja
on: 
  pull_request:
    branches:
      - main
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: github.event.pull_request.head.ref == Naranja-Smarttrainer-front 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd naranja-smarttrainer-frontend
          npm ci
          npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NARANJA_SMARTTRAINER_7A2CA }}
          projectId: naranja-smarttrainer-7a2ca
          entryPoint: naranja-smarttrainer-frontend
