<div class="modal-background" *ngIf="visible">
  <div class="modal-content">
    <!-- Encabezado con degradado -->
    <div class="modal-header">
      Editar Empleado
    </div>

    <!-- Contenedor para el cuerpo y los botones -->
    <div class="modal-body-container">
      <!-- Área desplazable con el formulario -->
      <div class="modal-body">
        <form>
          <!-- Cédula (se mantiene siempre deshabilitada) -->
          <div class="form-group">
            <label for="cedula">Cédula:</label>
            <div class="input-group">
              <input
                id="cedula"
                type="text"
                [(ngModel)]="empleado.cedula"
                name="cedula"
                disabled>
            </div>
          </div>          
          <!-- Nombre -->
          <div class="form-group">
            <label for="nombre">Nombre:</label>
            <div class="input-group">
              <input
                id="nombre"
                type="text"
                [(ngModel)]="empleado.nombre"
                name="nombre"
                [disabled]="!editFields['nombre']">
            </div>
          </div>

          <!-- Teléfono -->
          <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <div class="input-group">
              <input
                id="telefono"
                type="tel"
                [(ngModel)]="empleado.telefono"
                name="telefono"
                [disabled]="!editFields['telefono']">
            </div>
          </div>
          <!-- Dirección -->
          <div class="form-group">
            <label for="direccion">Dirección:</label>
            <div class="input-group">
              <input
                id="direccion"
                type="text"
                [(ngModel)]="empleado.direccion"
                name="direccion"
                [disabled]="!editFields['direccion']">
            </div>
          </div>
          <!-- Correo -->
          <div class="form-group">
            <label for="correo">Correo:</label>
            <div class="input-group">
              <input
                id="correo"
                type="email"
                [(ngModel)]="empleado.correo"
                name="correo"
                [disabled]="!editFields['correo']">
            </div>
          </div>
          <!-- RIF -->
          <div class="form-group">
            <label for="rif">RIF:</label>
            <div class="input-group">
              <input
                id="rif"
                type="text"
                [(ngModel)]="empleado.rif"
                name="rif"
                [disabled]="!editFields['rif']">
            </div>
          </div>
          <!-- Cargo -->
          <div class="form-group">
            <label for="cargo">Cargo:</label>
            <div class="input-group">
              <select
                id="cargo"
                [(ngModel)]="empleado.cargo"
                name="cargo"
                [disabled]="!editFields['cargo']">
                <option value="Entrenador">Entrenador</option>
                <option value="Administración">Administración</option>
                <option value="Mantenimiento">Mantenimiento</option>
                <option value="Recursos Humanos">Recursos Humanos</option>
              </select>
            </div>
          </div>
          <!-- Especialidad -->
          <div class="form-group">
            <label for="especialidad">Especialidad:</label>
            <div class="input-group">
              <input
                id="especialidad"
                type="text"
                [(ngModel)]="empleado.especialidad"
                name="especialidad"
                [disabled]="!editFields['especialidad']">
            </div>
          </div>
          <!-- Fecha de Inicio -->
          <div class="form-group">
            <label for="fechaInicio">Fecha de Inicio:</label>
            <div class="input-group">
              <input
                id="fechaInicio"
                type="date"
                [(ngModel)]="empleado.fechaInicio"
                name="fechaInicio"
                [disabled]="!editFields['fechaInicio']">
            </div>
          </div>
          <!-- Fecha de Finalización -->
          <div class="form-group">
            <label for="fechaFinalizacion">Fecha de Finalización:</label>
            <div class="input-group">
              <input
                id="fechaFinalizacion"
                type="date"
                [(ngModel)]="empleado.fechaFinalizacion"
                name="fechaFinalizacion"
                [disabled]="!editFields['fechaFinalizacion']">
            </div>
          </div>
        </form>
      </div>

      <!-- Barra de botones (fija) -->
      <div class="modal-buttons">
        <button type="button" class="btn-save" (click)="guardarCambios()">Guardar Cambios</button>
        <button type="button" class="btn-close" (click)="cerrar()">Cancelar</button>
      </div>
    </div>
  </div>
</div>
